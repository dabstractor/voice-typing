# hypr-binds.conf — voice-typing Hyprland keybinding (PRD §4.10 + Rev 2 single-mode; P1.M1.T2.S4).
#
# WHAT THIS IS
#   ONE bind:
#     CTRL+SUPER+ALT+D -> voicectl toggle
#   Rev 2 has a SINGLE dictation mode: the daemon loads one model (small.en) that produces
#   BOTH the live partial text and the finals (streaming, PRD §4.2quater), so there is no
#   second key and no mode switching. The bind arms the mic; pressing it again disarms it
#   (the graceful drain lets the in-flight final land first).
#   This file is SOURCED (not copied) from your hyprland.conf, so any edit here takes effect
#   after `hyprctl reload` — no per-user copy to drift. Coming from the old two-bind file:
#   after `hyprctl reload` you get exactly one bind and SUPER+ALT+D is free again.
#
# =====================================================================
#  USER INTEGRATION  (item DOCS: Mode A — this comment IS the hotkey doc)
# =====================================================================
#  Add ONE line to ~/.config/hypr/hyprland.conf (install.sh prints it; we never edit
#  your hyprland.conf for you):
#
#      source = <repo>/hypr-binds.conf
#
#  Then reload Hyprland:
#      hyprctl reload
#
#  VT-003: the bind below invokes voicectl via $HOME/.local/bin/voicectl — a STABLE launcher
#  symlink that install.sh maintains ($HOME/.local/bin/voicectl -> <repo>/.venv/bin/voicectl).
#  Hyprland runs every `bind exec` command through `/bin/sh -c`, so $HOME expands at press time
#  (verified in the Hyprland source: src/config/supplementary/executor/Executor.cpp spawn uses
#  execl("/bin/sh", "/bin/sh", "-c", ...)). This removes the hardcoded /home/<user> repo path so the
#  bind works regardless of which user runs it or where the repo was cloned. If you prefer the
#  absolute path, run `readlink -f ~/.local/bin/voicectl` and paste it here directly.
#
#  The daemon must be running (start it with ./install.sh or the systemd user unit); it boots
#  NOT-listening, so the FIRST press of the key arms the mic; the same key disarms it.
#
# PRECEDENCE / CONFLICTS
#   Hyprland uses the LAST matching bind for a given MODS+key. So `source` this file
#   LAST (at the bottom of ~/.config/hypr/hyprland.conf) so its bind wins.
#   If the bind is inert, your config may already bind that MODS+key elsewhere — check
#       ~/.config/hypr/custom/keybinds.conf
#       ~/.config/hypr/hyprland/keybinds.conf
#   or rebind below to a free combo.
#
# MODS SYNTAX
#   MODS split on whitespace OR underscore: `CTRL SUPER ALT` == `CTRL_SUPER_ALT` (both valid).
#   See https://wiki.hypr.land/Configuring/Basics/Binds/

# The single dictation bind (Rev 2: one mode, one model — small.en for live partials + finals).
bind = CTRL SUPER ALT, D, exec, $HOME/.local/bin/voicectl toggle
# Cancel fallback (PRD §4.2quater / P1.M2.T7.S1): SUPER+ALT+Backspace runs the SAME cancel path
# as the daemon's passive evdev Backspace listener (P1.M2.T7.S2). Use this bind when evdev
# cannot open a keyboard node; it is also the automated-test seam. cancel drops the tentative
# dictation fragment (compensating the keystroke by subtraction) and discards the in-flight
# utterance while the mic stays hot — idempotent when nothing is pending.
bind = SUPER ALT, Backspace, exec, $HOME/.local/bin/voicectl cancel
