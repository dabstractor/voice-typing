# =============================================================================
# voice-typing configuration
# =============================================================================
#
# WHAT THIS FILE IS
#   Both the daemon's runtime default AND the user-facing config reference (PRD
#   "Mode A"). The values below ARE the built-in defaults: change one to tune
#   the daemon and nothing else needs editing. Every line is commented so this
#   file reads as documentation.
#
# SEARCH ORDER  (first existing file wins; lowest priority is the defaults baked
# into voice_typing/config.py)
#   1. $XDG_CONFIG_HOME/voice-typing/config.toml   (unset/empty -> ~/.config/...)
#   2. <repo>/config.toml                          (this file)
#   3. dataclass defaults in voice_typing/config.py
#   install.sh copies this file to location (1) if it is missing, so your edits
#   survive reinstalls.
#
# SCHEMA SOURCE
#   voice_typing/config.py is the single source of truth for the schema and the
#   default values; this file mirrors it. Keep the two in lockstep: if you change
#   a default in code, change it here too. Unknown keys AND unknown tables are REJECTED
#   at load time (a typo raises an error instead of being silently ignored). Wrong-typed values are
#   rejected at load too: a string where a number is expected raises TypeError (so
#   `auto_stop_idle_seconds = "thirty"` fails fast, not silently).
#
# =============================================================================


[asr]   # speech recognition: models, device, voice-activity-detection timing

lite_model                   = "small.en"          # the SINGLE transcription model (Rev 2 single-mode): loaded once, used for BOTH live partials AND typed finals. Dictation is armed/disarmed with Ctrl+Alt+Super+D.
language                     = "en"                # ISO-639-1 code, e.g. "en", "es", "fr", "de".
device                       = "cuda"              # "cuda" | "cpu". The daemon AUTO-FALLS-BACK to "cpu" (and smaller models) at startup if ctranslate2 finds no usable CUDA device; see voice_typing/cuda_check.py (PRD 4.4). Usually leave this as "cuda".
post_speech_silence_duration = 0.6                 # seconds of silence after speech before a final is emitted. Lower = snappier but can cut off pauses; higher = fewer false finals but slower.
lite_post_speech_silence_duration = 0.8            # PRD §4.2quater: the endpointer only delays COMMIT under streaming (words are already typed live) — 0.8 halves mid-thought cuts for +0.3 s commit latency. 0.5 = razor-snappy; 1.0 = near-zero cuts.
context_prompt               = true                # PRD §4.2quater: condition every decode on the rolling committed context (back to the last sentence boundary, ~200-token cap) so continuations read coherently. false = decode each utterance blind.
realtime_processing_pause    = 0.15                # seconds between live partial updates. Lower = more responsive status; higher = less CPU.
auto_stop_idle_seconds       = 30.0                # auto-disarm (stop listening) after this many seconds with NO recognized speech. Partials reset the clock while you talk, so it only fires when you truly go silent — prevents a forgotten hot-mic. Fires the normal stop popup + a journal line. 0 disables.
auto_unload_idle_seconds     = 1800.0              # after this many seconds DISARMED (models loaded, NOT listening), tear down the recorder to free VRAM (~0). The clock starts on disarm (manual stop, toggle-off, or the auto-stop above) and resets on any arm; time listening does NOT count. 0 disables (models stay resident until quit). (PRD 4.2bis Idle unload)


[output]   # how typed text leaves the daemon

backend     = "wtype"   # "wtype" (Wayland virtual keyboard, default) | "ydotool" (kernel uinput, TTY/X fallback) | "null" (types nothing; used by the headless E2E tests). The daemon auto-falls-back from wtype to ydotool on failure.
append_space = true     # append one trailing space after each final so consecutive utterations flow as words. false = type text verbatim.
streaming   = true      # PRD §4.2quater: type stabilized partials live + revise in place as the utterance grows. false = append-only finals (rollback hatch to the pre-Rev-2 typing behavior).


[cancel]   # Rev 2: erase the last committed utterance (PRD §4.2quater)

on_backspace = true     # enable the cancel gesture (PRD §4.2quater): while dictating — a tentative fragment is on screen — a physical Backspace erases the fragment and drops the in-flight utterance; the mic stays hot, just speak again. Any other keypress freezes the fragment instead (it is never typed over). Fallback bind: Alt+Super+Backspace (`voicectl cancel`) works even with no readable keyboard.
devices     = []        # keyboard device node(s) to watch for the physical-Backspace gesture, e.g. ["/dev/input/event3"]. Empty list = auto-detect keyboards exposing KEY_BACKSPACE (virtual uinput/ydotool devices are always excluded, so self-typing cannot self-cancel). Nothing readable -> one journal warning at the first arm; the Alt+Super+Backspace fallback bind still works.


[feedback]   # runtime state file + Hyprland notifications

state_file  = ""        # "" (empty) -> resolved at runtime to $XDG_RUNTIME_DIR/voice-typing/state.json (set by systemd user sessions). Set an absolute path to override. If empty AND XDG_RUNTIME_DIR is unset, the daemon raises at write time (no silent fallback). Leave empty for normal use.
hypr_notify = true      # show a hyprctl notify one-liner for start/final/stop. Requires Hyprland; harmless elsewhere (the notify call is skipped when false).
notify_ms   = 2500      # how long the hyprctl notification stays on screen, in milliseconds.
notify_on_final = true  # also pop a hyprctl popup for each FINALIZED utterance ("✔ <text>")? The text is already typed into the focused window, so this is redundant for most setups — set false to keep only the brief Recording / Recording Stopped toasts. hypr_notify=false still suppresses EVERYTHING.


[filter]   # post-recognition text cleanup (consumed by textproc.clean)

min_chars = 2           # finals shorter than this many characters are dropped (filters out "oh", "huh", etc.). Set 1 to type everything.
blocklist = [           # EXACT, case-insensitive matches that are dropped instead of typed. These are the classic Whisper silence hallucinations. Add your own; remove any you actually say.
  "thank you.",                   # most common hallucination
  "thanks for watching.",         # YouTube-style filler
  "bye.",                         # sign-off hallucination
  "thank you for watching",       # long-form filler
]                              # NOTE (VT-006): the bare "you" entry was removed — it is a common word users want to type, not a hallucination.


[log]   # daemon logging verbosity (PRD §4.2)

# "INFO" emits one structured latency line per typed utterance + the startup device/models line.
# "DEBUG" additionally emits the raw monotonic timestamps per utterance (use when finals exceed
# the 1.5s target to see exact t_speech_end/t_final_ready/t_typed).
# Under systemd these flow to journald: `journalctl --user -u voice-typing -f`.
level = "INFO"
